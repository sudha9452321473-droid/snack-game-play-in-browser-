<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="67pf4Nl6iUL1thbl6byAE6hIxISNzEvJ2YKGTZ0ADV4" />
<title>Koi Pond</title>
<style>
:root{--bg:#e6f2ee;--water:#cfe8e1;--ink:#12383f;--koi:#ff5a36;--koi2:#ffe3d6;--lotus:#d94f86;--line:#b4d6cd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1f24;--water:#0f3039;--ink:#d8efe9;--koi:#ff6a45;--koi2:#ffe0d2;--lotus:#f08ab4;--line:#1c4a56;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1f24;--water:#0f3039;--ink:#d8efe9;--koi:#ff6a45;--koi2:#ffe0d2;--lotus:#f08ab4;--line:#1c4a56;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:baseline;width:min(92vw,56vh,440px)}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:.01em}
.score{font-size:.85rem;text-align:right}
.score b{font-size:1.1rem}
.wrap{position:relative;width:min(92vw,56vh,440px);aspect-ratio:1}
canvas{width:100%;height:100%;border-radius:18px;border:3px solid var(--line);background:var(--water);touch-action:none;display:block}
.overlay{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.overlay[hidden]{display:none}
.overlay p{margin:0;max-width:28ch;line-height:1.45}
.overlay h2{margin:0;font-size:1.5rem}
button{font:inherit;cursor:pointer;color:var(--ink)}
.go{background:var(--koi);color:#fff;border:0;border-radius:999px;padding:10px 24px;font-weight:700;font-size:1.05rem}
.go:focus-visible,.pad button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,min(76px,22vw));grid-template-rows:repeat(2,min(64px,9vh));gap:10px}
.pad button{background:var(--water);border:2px solid var(--line);border-radius:18px;font-size:1.6rem;touch-action:manipulation}
.pad button:active{background:var(--line)}
body:not(.playing) .pad{visibility:hidden}
.ttl{display:flex;align-items:center;gap:8px}
#sb{background:none;border:0;font-size:1.2rem;padding:0;line-height:1;touch-action:manipulation}
.pad .u{grid-column:2}.pad .v{grid-column:1;grid-row:1}.pad .p{grid-column:3;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.speed{display:flex;gap:6px}
.speed button{background:var(--water);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.9rem}
.speed button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>
<body>
<header><div class="ttl"><h1>Koi Pond</h1><button id="sb" aria-label="Toggle sound">🔊</button></div><div class="score">Level <b id="lv">1</b> &nbsp; Blooms <b id="sc">0</b> &nbsp; Best <b id="bs">0</b></div></header>
<div class="wrap">
  <canvas id="c" width="400" height="400" aria-label="Koi pond game board"></canvas>
  <div class="overlay" id="ov">
    <h2 id="ot">Guide the koi</h2>
    <p id="om">Swim to the lotus blooms. Golden blooms are worth three but fade fast. The pond edges wrap around, so just avoid your own tail. Swipe anywhere, use the buttons, or press arrow keys.</p>
    <div class="speed" role="group" aria-label="Swim speed"><button data-s="1.4">Slow</button><button data-s="1" class="on">Normal</button><button data-s=".7">Fast</button></div>
    <button class="go" id="go">Start swimming</button>
  </div>
</div>
<div class="pad" aria-label="Steering controls"><button class="v" id="vb" aria-label="Toggle vibration">📳</button><button class="p" id="pb" aria-label="Pause or resume">⏸</button>
  <button class="u" data-d="0,-1" aria-label="Up">↑</button>
  <button class="l" data-d="-1,0" aria-label="Left">←</button>
  <button class="d" data-d="0,1" aria-label="Down">↓</button>
  <button class="r" data-d="1,0" aria-label="Right">→</button>
</div>
<script>
const N=20,cv=document.getElementById('c'),ctx=cv.getContext('2d'),S=cv.width/N;
const $=id=>document.getElementById(id);
const PADS=[[2,3],[16,2],[5,16],[17,14],[10,6],[13,17]];
const nz=d=>d>1?-1:d<-1?1:d;
let spd=1;
let AC=null,snd=true,musicT=null,step=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.12,when=0,slide=0){const a=ac();if(!a||!snd)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={eat(){tone(520,.12,'sine',.15,0,1.6);tone(780,.14,'sine',.1,.07)},gold(){[660,880,1100,1320].forEach((f,i)=>tone(f,.18,'triangle',.12,i*.07))},die(){tone(300,.5,'sawtooth',.1,0,.3)},turn(){tone(300,.03,'sine',.04)}};
function music(){if(musicT)return;const sc=[330,392,440,523,587,659];musicT=setInterval(()=>{if(state!=='run'||!snd)return;tone(sc[(Math.random()*sc.length)|0],1.2,'sine',.045);if(step++%4===0)tone(165,1.6,'sine',.05)},450)}
let ripples=[],gold=null,grow=0,vib=true;
function buzz(p){if(vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function spawnGold(){let g;do{g={x:Math.random()*N|0,y:Math.random()*N|0,life:45}}while(snake.some(s=>s.x===g.x&&s.y===g.y)||(g.x===food.x&&g.y===food.y));gold=g}
let snake,dir,next,food,score=0,best=0,timer,state='idle';
try{best=+localStorage.getItem('koi-best')||0}catch(e){}
$('bs').textContent=best;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;$('sc').textContent=0;$('lv').textContent=1;gold=null;grow=0;ripples=[];place();draw()}
function start(){ac();music();reset();state='run';$('ov').hidden=true;clearTimeout(timer);tick()}
function over(){
  state='over';buzz([60,40,120]);sfx.die();
  if(score>best){best=score;$('bs').textContent=best;try{localStorage.setItem('koi-best',best)}catch(e){}}
  $('ot').textContent='The koi has stopped';
  $('om').textContent='You gathered '+score+(score===1?' bloom.':' blooms.')+' Best this visit: '+best+'.';
  $('go').textContent='Swim again';$('ov').hidden=false;$('go').focus();
}
function tick(){
  if(state!=='run')return;
  dir=next;
  const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
  if(snake.some(s=>s.x===h.x&&s.y===h.y)){draw();return over()}
  snake.unshift(h);
  let ate=false;
  if(h.x===food.x&&h.y===food.y){ate=true;score++;ripples.push({x:h.x,y:h.y,t:performance.now()});place();buzz(25);sfx.eat();if(!gold&&Math.random()<.25)spawnGold()}
  else if(gold&&h.x===gold.x&&h.y===gold.y){ate=true;score+=3;grow+=2;ripples.push({x:h.x,y:h.y,t:performance.now()});gold=null;buzz([20,40,20]);sfx.gold()}
  if(gold&&--gold.life<=0)gold=null;
  if(ate){$('sc').textContent=score;$('lv').textContent=1+(score/5|0)}else if(grow>0)grow--;else snake.pop();
  draw();
  timer=setTimeout(tick,Math.max(60,150-score*3)*spd);
}
function turn(x,y){
  if(state!=='run'||(x===-dir.x&&y===-dir.y))return;
  next={x,y};sfx.turn();
}
function draw(){
  const water=css('--water'),line=css('--line'),koi=css('--koi'),koi2=css('--koi2'),lotus=css('--lotus'),ink=css('--ink');
  ctx.fillStyle=water;ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=line;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){ctx.beginPath();ctx.arc(i*S+S/2,j*S+S/2,1.5,0,7);ctx.fill()}
  ctx.save();ctx.globalAlpha=.14;ctx.fillStyle=ink;
  for(const[p,q]of PADS){ctx.beginPath();ctx.moveTo(p*S+S/2,q*S+S/2);ctx.arc(p*S+S/2,q*S+S/2,S*.85,.4,5.9);ctx.closePath();ctx.fill()}
  ctx.restore();
  const now=performance.now();ripples=ripples.filter(r=>now-r.t<900);
  ctx.lineWidth=2;
  for(const r of ripples){const k=(now-r.t)/900;ctx.globalAlpha=1-k;ctx.strokeStyle=lotus;ctx.beginPath();ctx.arc(r.x*S+S/2,r.y*S+S/2,S*(.4+k*2.2),0,7);ctx.stroke()}
  ctx.globalAlpha=1;
  if(gold&&(gold.life>12||Math.floor(now/150)%2)){const gx=gold.x*S+S/2,gy=gold.y*S+S/2,pu=1+.15*Math.sin(now/120);ctx.fillStyle='#ffc233';for(let k=0;k<8;k++){const a=k*Math.PI/4;ctx.beginPath();ctx.ellipse(gx+Math.cos(a)*5.5*pu,gy+Math.sin(a)*5.5*pu,6,3,a,0,7);ctx.fill()}ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(gx,gy,3.5,0,7);ctx.fill()}
  // lotus bloom
  const fx=food.x*S+S/2,fy=food.y*S+S/2;
  ctx.fillStyle=lotus;
  for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.beginPath();ctx.ellipse(fx+Math.cos(a)*5,fy+Math.sin(a)*5,6,3.2,a,0,7);ctx.fill()}
  ctx.fillStyle=koi2;ctx.beginPath();ctx.arc(fx,fy,3.5,0,7);ctx.fill();
  // koi body, tail first
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],r=S/2*(0.95-0.4*i/Math.max(snake.length,6));
    ctx.fillStyle=(i%3===2)?koi2:koi;
    ctx.beginPath();ctx.arc(s.x*S+S/2,s.y*S+S/2,r,0,7);ctx.fill();
  }
  if(snake.length>1){const tl=snake[snake.length-1],pv=snake[snake.length-2],tx=nz(tl.x-pv.x),ty=nz(tl.y-pv.y),cx0=tl.x*S+S/2,cy0=tl.y*S+S/2;ctx.fillStyle=koi2;ctx.beginPath();ctx.moveTo(cx0,cy0);ctx.lineTo(cx0+tx*S*.9-ty*6,cy0+ty*S*.9+tx*6);ctx.lineTo(cx0+tx*S*.9+ty*6,cy0+ty*S*.9-tx*6);ctx.closePath();ctx.fill()}
  // eyes
  const hd=snake[0],cx=hd.x*S+S/2,cy=hd.y*S+S/2,px=-dir.y,py=dir.x;
  ctx.fillStyle=ink;
  for(const sd of[-1,1]){ctx.beginPath();ctx.arc(cx+dir.x*4+px*sd*4.5,cy+dir.y*4+py*sd*4.5,2.2,0,7);ctx.fill()}
}
$('go').onclick=()=>{state==='paused'?resume():start()};
$('pb').onclick=()=>{if(state==='run'){state='paused';$('ot').textContent='Resting';$('om').textContent='Press space or the button to keep swimming.';$('go').textContent='Resume';$('ov').hidden=false}else if(state==='paused')resume()};
$('vb').onclick=()=>{vib=!vib;$('vb').style.opacity=vib?1:.4;buzz(15)};
$('sb').onclick=()=>{snd=!snd;$('sb').textContent=snd?'🔊':'🔇';if(snd){ac();sfx.turn()}};
document.querySelectorAll('.speed button').forEach(b=>b.onclick=()=>{spd=+b.dataset.s;document.querySelectorAll('.speed button').forEach(x=>x.classList.toggle('on',x===b))});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='run')$('pb').click()});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();if(state==='run')turn(m[0],m[1]);else if(state!=='run'&&state!=='paused'&&document.activeElement!==$('go'))start();}
  else if(k===' '&&state==='run'){e.preventDefault();state='paused';$('ot').textContent='Resting';$('om').textContent='Press space or the button to keep swimming.';$('go').textContent='Resume';$('ov').hidden=false}
  else if(k===' '&&state==='paused'){e.preventDefault();resume()}
});
function resume(){state='run';$('ov').hidden=true;tick()}
document.querySelectorAll('.pad button[data-d]').forEach(b=>{const fire=()=>{const[d,e]=b.dataset.d.split(',').map(Number);turn(d,e);buzz(8)};b.addEventListener('pointerdown',ev=>{ev.preventDefault();fire()});b.addEventListener('click',ev=>{if(ev.detail===0)fire()})});
let t0=null;
document.addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
document.addEventListener('touchend',e=>{
  if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);
},{passive:true});
function loop(){document.body.classList.toggle('playing',state==='run'||state==='paused');draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
reset();
</script>
</body>
</html>
